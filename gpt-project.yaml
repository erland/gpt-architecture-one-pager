schema_version: 1
project:
  id: architecture-one-pager
  name: Architecture One Pager
  description: Concise, decision-oriented architecture one-pagers for technologies, frameworks, platforms, products, methods, architecture practices and IT trends.
  profile: guided_research_output

analysis:
  source: existing-project-conversion
  runtime:
    strategy: peer_candidates
    candidates:
      - runtime_id: chatgpt_chat
        suitability: ready
        activate_by_default: true
        reason: Existing portable Chat distribution already embeds the complete canonical runtime contract.
      - runtime_id: chatgpt_custom
        suitability: ready
        activate_by_default: true
        reason: Existing Custom GPT package is the original runtime target and already carries canonical instructions and supporting Knowledge.
      - runtime_id: claude_project
        suitability: ready
        activate_by_default: true
        reason: The workflow is instruction-driven, non-stateful and can be carried by project instructions plus reference files.
      - runtime_id: opencode
        suitability: ready
        activate_by_default: true
        reason: The canonical workflow can run directly in a workspace; local tools are optional rather than required for core behavior.
      - runtime_id: openai_plugin
        suitability: reduced
        activate_by_default: false
        reason: Skills can carry methodology but add little value because the core product is primarily an instruction-driven one-pager workflow.

model_robustness:
  level: guided
  rationale: The assistant follows an explicit eight-step workflow with deterministic semantic gates, but does not require persistent cross-session state.
  operational_core: true
  explicit_workflow: true
  deterministic_gates: true
  instruction_adherence_evals: true

instructions:
  canonical: gpt-configuration/gpt-instructions.txt
  core_contract:
    enabled: true
    required_markers:
      - "RUNTIME CONTRACT — FOLLOW FOR EVERY ONE-PAGER REQUEST"
      - "1. LANGUAGE"
      - "2. TOPIC CHECK"
      - "3. CLASSIFICATION"
      - "4. CURRENT-INFORMATION CHECK"
      - "5. ASSESSMENT"
      - "6. RECOMMENDATION"
      - "7. OUTPUT"
      - "8. EXPORT"
      - "Choose exactly one recommendation"
      - "FINAL SELF-CHECK BEFORE SENDING A ONE-PAGER"
    knowledge_may_not_be_required_for_core_behavior: true

knowledge_architecture:
  canonical_root: knowledge
  files: 5
  role: optional_supporting_reference
  examples_root: examples
  examples: 3
  examples_role: style_and_quality_only

capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  requirements:
    web:
      level: recommended
      reason: Required for fresh claims about products, platforms, trends, regulation, pricing, lifecycle, security and market information.
    filesystem:
      read: recommended
      write: optional
    shell:
      level: optional
    code_execution:
      level: optional
      reason: Useful for export or batch processing but not required for core one-pager behavior.
    structured_data:
      level: optional
    persistent_state:
      level: not_required
    external_tools:
      level: optional
    image_generation:
      level: not_required

artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    one_pager:
      kind: report
      format: markdown
      requirement: required
      persistence: ephemeral
      multiplicity: one
    markdown_export:
      kind: report
      format: markdown
      requirement: optional
      persistence: persistent
      multiplicity: one
    confluence_export:
      kind: document
      format: text
      requirement: optional
      persistence: persistent
      multiplicity: one
    pdf_export:
      kind: document
      format: pdf
      requirement: optional
      persistence: persistent
      multiplicity: one
    word_export:
      kind: document
      format: docx
      requirement: optional
      persistence: persistent
      multiplicity: one
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one

workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: optional
    persistence: ephemeral
    portable: true
    separate_from_assistant: true
    description: Supplied organizational context or files are working material, not persistent assistant state.
  state:
    requirement: not_required
    persistence: ephemeral
    authority: conversation
    description: The eight-step workflow completes within the current request; no cross-session state machine is required.
  runtime_preferences:
    chat: conversation
    agent: workspace_optional

tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
    - id: distribution-validation
      type: script
      requirement: required
      purpose: Validate canonical workflow markers, runtime package integrity and semantic parity.
      script: scripts/validate_distributions.py
      deterministic: true
      mutates_workspace: false
    - id: runtime-regression
      type: script
      requirement: required
      purpose: Validate lightweight-model behavioral guardrails against the canonical instruction contract.
      script: scripts/validate_runtime_regressions.py
      deterministic: true
      mutates_workspace: false

runtime:
  primary: none
  chat_zip:
    enabled: true
    legacy_builder: scripts/build_distributions.py
  custom_gpt:
    enabled: true
    legacy_builder: scripts/build_distributions.py
    knowledge:
      max_files: 20
      strategy: identical
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    builder: scripts/build_peer_distributions.py
    validator: scripts/validate_peer_distributions.py
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      examples: project/examples
      runtime_contract: project/runtime-contract.json
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    builder: scripts/build_peer_distributions.py
    validator: scripts/validate_peer_distributions.py
    instructions: AGENTS.md
    runtime_root: .opencode/architecture-one-pager
    runtime_contract: .opencode/architecture-one-pager/runtime-contract.json
  openai_plugin:
    enabled: false
    role: assessed_reduced

ci:
  enabled: true
  workflow: .github/workflows/build-distributions.yml

release:
  github:
    enabled: true
    workflow: .github/workflows/build-distributions.yml
    version_source: release_tag

migration:
  target: gpt-builder-1.5.0
  type: existing-project-conversion
  preserve_domain_behavior: true
  preserve_legacy_distribution_sources_until_replaced: true

testing:
  manifest: tests/test-manifest.yaml
  manifest_schema: schemas/test-manifest.schema.json
  runtime_cases: tests/runtime-regression-cases.json
  contract_validator: scripts/validate_gpt_builder_tests.py
  deterministic_contracts_block_release: true
  live_model_runtime_evals_are_separate: true

runtime_parity:
  model: runtime-parity.yaml
  registered_runtimes:
    - chatgpt_chat
    - chatgpt_custom
    - claude_project
    - opencode
    - openai_plugin
  compared_categories:
    - behavior
    - capability
    - artifact
    - workspace_state
    - tool
