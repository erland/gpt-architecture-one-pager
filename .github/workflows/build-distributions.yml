name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag. Expected v<semver>, e.g. v1.1.0." >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version '${{ steps.version.outputs.version }}'

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version '${{ steps.version.outputs.version }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-one-pager-distributions-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip --clobber
