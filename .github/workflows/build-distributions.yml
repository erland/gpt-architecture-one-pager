name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python3 -m pip install pyyaml jsonschema

      - name: Validate project with canonical GPT Byggaren lint
        run: python3 scripts/lint_gpt_project.py

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag. Expected v<semver>, e.g. v1.1.0." >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version '${{ steps.version.outputs.version }}'

      - name: Validate GPT Builder test contract
        run: python3 scripts/validate_gpt_builder_tests.py

      - name: Validate runtime regressions
        run: python3 scripts/validate_runtime_regressions.py

      - name: Test generated one-pager acceptance validator (fixtures)
        run: python3 -m unittest discover -s tests -p 'test_generated_one_pager.py' -v

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --project-root .

      - name: Validate canonical delivery
        run: python3 scripts/validate_generated_delivery.py --project-root . --version '${{ steps.version.outputs.version }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-one-pager-distributions-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
